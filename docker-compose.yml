version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: waste_user
      POSTGRES_PASSWORD: waste_pass
      POSTGRES_DB: waste_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waste_user -d waste_management"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://waste_user:waste_pass@db:5432/waste_management
      MODEL_SERVICE_URL: http://model-service:8001
      SECRET_KEY: dev-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    depends_on:
      db:
        condition: service_healthy
      model-service:
        condition: service_started
    volumes:
      - ./backend:/app
      - static_files:/app/static

  model-service:
    build:
      context: ./model-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      MOCK_MODE: "true"
    volumes:
      - ./model-service:/app

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  static_files:
