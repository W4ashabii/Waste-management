services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: waste_user
      POSTGRES_PASSWORD: waste_pass
      POSTGRES_DB: waste_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waste_user -d waste_management"]
      interval: 5s
      timeout: 5s
      retries: 5

  model-service:
    build:
      context: ./model-service
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json,sys; sys.exit(json.load(urllib.request.urlopen('http://localhost:8001/health'))['status']!='healthy')"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://waste_user:waste_pass@db:5432/waste_management
      MODEL_SERVICE_URL: http://model-service:8001
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      db:
        condition: service_healthy
      model-service:
        condition: service_healthy

  # The Next.js frontend lives in ../waste-management-website.
  frontend:
    build:
      context: ../waste-management-website
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
